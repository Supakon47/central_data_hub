services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: central_data_hub
      POSTGRES_USER: central_data_hub
      POSTGRES_PASSWORD: change-this-before-use
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U central_data_hub -d central_data_hub"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://central_data_hub:change-this-before-use@db:5432/central_data_hub
      APP_ENV: development
      GOOGLE_SHEETS_ENABLED: ${GOOGLE_SHEETS_ENABLED:-false}
      GOOGLE_SHEETS_AUTO_SYNC_ENABLED: ${GOOGLE_SHEETS_AUTO_SYNC_ENABLED:-false}
      AUTO_SYNC_POLL_SECONDS: ${AUTO_SYNC_POLL_SECONDS:-60}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${GOOGLE_SERVICE_ACCOUNT_JSON:-}
      GOOGLE_SERVICE_ACCOUNT_FILE: ${GOOGLE_SERVICE_ACCOUNT_FILE:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-}
      ADMIN_SESSION_TTL_SECONDS: ${ADMIN_SESSION_TTL_SECONDS:-28800}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data

  # Trial copy for testing imports: its own database and image folder, the main
  # data is never touched. Start with: docker compose --profile trial up -d web-trial
  # (create the database once first; see README "ระบบทดลองนำเข้า").
  web-trial:
    profiles: ["trial"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://central_data_hub:change-this-before-use@db:5432/central_data_hub_trial
      APP_ENV: development
      IMAGE_STORAGE_DIR: /app/data/trial-images
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-}
      ADMIN_SESSION_TTL_SECONDS: ${ADMIN_SESSION_TTL_SECONDS:-28800}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:8000"
    volumes:
      - ./data:/app/data
      # Source workbooks, read-only. Override the folder with RAWDATA_DIR in .env.
      - ${RAWDATA_DIR:-../RawData}:/rawdata:ro

volumes:
  postgres_data:
