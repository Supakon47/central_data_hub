<section id="explorer" class="view active">
  <div class="section-heading">
    <div>
      <h2>Data Explorer</h2>
      <p>ค้นหาและกรองข้อมูลจากสำเนากลาง โดยทุกแถวย้อนกลับไปยังแหล่งข้อมูลได้</p>
    </div>
  </div>
  <form id="search-form" class="filters explorer-filter-bar">
    <label class="explorer-search"><span class="sr-only">คำค้น</span><input id="query" name="q" type="search" placeholder="ค้นหา: เลขทะเบียน เลขเดิม รายการ ประวัติ ชนิด อายุสมัย…" /></label>
    <label><span class="sr-only">ชีตต้นทาง</span><select id="sheet-filter" name="source_sheet"><option value="">ทุกบัญชี (แผ่นงาน)</option></select></label>
    <label><span class="sr-only">ปีทะเบียน</span><select id="year-filter" name="registration_year"><option value="">ทุกปีทะเบียน</option></select></label>
    <label><span class="sr-only">กลุ่มอายุสมัย</span><select id="period-filter" name="period_group"><option value="">ทุกสมัย</option></select></label>
    <label><span class="sr-only">กลุ่มชนิด</span><select id="material-filter" name="material_group"><option value="">ทุกชนิด</option></select></label>
    <label><span class="sr-only">รายละเอียดรายการ</span><select id="description-filter" name="has_description"><option value="">รายละเอียด: ทั้งหมด</option><option value="true">มีรายละเอียด</option><option value="false">มีเฉพาะเลขทะเบียน/สถานะ</option></select></label>
    <label><span class="sr-only">รูปภาพ</span><select id="image-filter" name="has_image"><option value="">ภาพ: ทั้งหมด</option><option value="true">มีภาพ</option><option value="false">ไม่มีภาพ</option></select></label>
    <label><span class="sr-only">การตรวจสอบข้อมูล</span><select id="check-filter" name="status_data_check"><option value="">ตรวจสอบข้อมูล: ทั้งหมด</option></select></label>
    <label><span class="sr-only">การถ่ายภาพ</span><select id="photo-filter" name="status_photographed"><option value="">ถ่ายภาพ: ทั้งหมด</option></select></label>
    <label><span class="sr-only">ระบบ Antique</span><select id="antique-filter" name="status_antique"><option value="">ระบบ Antique: ทั้งหมด</option></select></label>
    <label><span class="sr-only">การส่งขึ้นห้องคลัง</span><select id="storage-filter" name="status_storage"><option value="">ห้องคลัง: ทั้งหมด</option></select></label>
    <label><span class="sr-only">การเรียงลำดับ</span><select id="sort-filter" name="sort_by"><option value="registration">เรียงตามเลขทะเบียน</option><option value="source">เรียงตามลำดับในไฟล์</option></select></label>
    <button type="submit">ค้นหา</button>
    <button id="reset-filters" class="secondary" type="button">ล้างตัวกรอง</button>
  </form>
  <div class="explorer-toolbar">
    <p id="result-summary" class="muted"></p>
    <div class="view-switch" aria-label="รูปแบบการแสดงผล">
      <button type="button" class="secondary active" data-explorer-view="cards">การ์ด</button>
      <button type="button" class="secondary" data-explorer-view="table">ตาราง</button>
    </div>
  </div>
  <div id="records-cards" class="records-cards"></div>
  <div id="records-table-wrap" class="table-wrap" hidden>
    <table>
      <thead><tr><th>ภาพ</th><th>เลขทะเบียน</th><th>รายการ</th><th>ชนิด</th><th>อายุสมัย</th><th>ตรวจสอบ</th><th>แหล่งข้อมูล</th></tr></thead>
      <tbody id="records-body"></tbody>
    </table>
  </div>
  <div class="pagination">
    <button id="previous-page">ก่อนหน้า</button><span id="page-label"></span><button id="next-page">ถัดไป</button>
  </div>
</section>
